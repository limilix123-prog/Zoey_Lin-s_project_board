{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<h1>Create an account</h1>
{% if error %}
  <div class="flash" role="alert">{{ error }}</div>
{% endif %}
<form method="post" action="{{ url_for('auth_register.submit_register') }}" autocomplete="off">
  <p>
    <label for="reg-username">Username</label><br />
    <input id="reg-username" name="username" type="text" maxlength="64" required value="{{ form.username | e }}" />
  </p>
  <p>
    <label for="reg-password">Password</label><br />
    <input id="reg-password" name="password" type="password" maxlength="1024" required />
  </p>
  <p>
    <button type="submit">Register</button>
  </p>
</form>
<p class="muted">Already have an account? <a href="{{ url_for('auth_login.show_login_form') }}">Sign in</a>.</p>
{% endblock %}
